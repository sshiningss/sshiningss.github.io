<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixel painter</title>
<style>
:root{--bg:#eef1f5;--fg:#1b2230;--mut:#5d6778;--card:#fff;--bd:#d3d9e2;--ac:#2f6bff;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#e8ecf3;--mut:#9aa5b8;--card:#1c212b;--bd:#323a49;--ac:#6b96ff;--acf:#0b1020}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#e8ecf3;--mut:#9aa5b8;--card:#1c212b;--bd:#323a49;--ac:#6b96ff;--acf:#0b1020}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:baseline;gap:12px}
header b{font-size:18px;letter-spacing:-.02em}header span{color:var(--mut);font-size:13px}
main{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr}
#side{padding:14px;border-right:1px solid var(--bd);overflow:auto;display:flex;flex-direction:column;gap:12px}
#area{display:flex;flex-direction:column;min-width:0;min-height:0}
#wrap{flex:1;overflow:auto;padding:16px;min-height:0}
#stage{position:relative;width:max-content;margin:auto;box-shadow:0 2px 14px rgba(0,0,0,.25);line-height:0}
#empty{margin:auto;text-align:center;color:var(--mut);max-width:320px;padding:40px 0}
canvas{touch-action:none;image-rendering:pixelated}
button,.btn{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-block;text-align:center}
button:hover,.btn:hover{border-color:var(--ac)}button:focus-visible,.btn:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);font-weight:600}
label.row{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}label.row b{color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--ac)}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
#pal{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--bd);overflow-x:auto;background:var(--card)}
.sw{flex:none;width:52px;height:52px;border-radius:8px;border:2px solid transparent;font-weight:700;font-size:16px;position:relative;padding:0;display:grid;place-items:center;outline:1px solid var(--bd)}
.sw small{position:absolute;bottom:1px;right:4px;font-size:10px;font-weight:500;opacity:.85}
.sw.on{border-color:var(--ac);outline:2px solid var(--fg);box-shadow:none}.sw.done{opacity:.35}
#pulse{position:absolute;border:3px solid #ff2d6f;border-radius:4px;pointer-events:none;animation:p .6s ease-in-out 5 alternate;z-index:2}
@keyframes p{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:.35}}
@media (prefers-reduced-motion:reduce){#pulse{animation:none}}
#modal,#gal{position:fixed;inset:0;background:rgba(8,10,16,.72);display:none;overflow:auto;padding:20px;z-index:9}
#modal>div,#gal>div{background:var(--card);border-radius:14px;max-width:760px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px}
#modal img,#gal img{max-width:100%;image-rendering:pixelated;border:1px solid var(--bd);border-radius:6px;background:#fff}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.res figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
figcaption{font-size:13px;color:var(--mut)}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{border-right:0;border-bottom:1px solid var(--bd);max-height:38vh}}
#wrap,#pal{scrollbar-width:none;-ms-overflow-style:none}#wrap::-webkit-scrollbar,#pal::-webkit-scrollbar{display:none}
.g{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}.pair{display:flex;gap:10px;align-items:center}.pair input[type=range]{flex:1;min-width:0}
input[type=number]{width:74px;font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg);cursor:pointer}.chk input{accent-color:var(--ac)}
#gal{z-index:8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff}.card b{overflow-wrap:anywhere}.card small{color:var(--mut)}
.card .row2{display:flex;gap:6px}.card button{flex:1;padding:6px 8px;font-size:13px}
#nm{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);width:100%}
</style></head><body>
<header><b>Paint by Pixel</b><span>Turn any image into a numbered pixel painting</span><button id="gb" style="margin-left:auto">Gallery</button></header>
<main>
<aside id="side"></aside>
<section id="area">
 <div id="wrap"><div id="empty">Drop an image anywhere, choose one from the left, or try the sample to see how it works.</div>
 <div id="stage" hidden><canvas id="cv"></canvas><div id="pulse" hidden></div></div></div>
 <div id="pal" hidden></div>
</section></main>
<div id="modal"><div id="mbody"></div></div>
<div id="gal"><div id="gbody"></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
let src=null,W=0,H=0,K=12,merge=5,size=40,pal=[],tgt,fill,hist=[],rem=[],cur=0,tool='brush',cs=22,mode='setup',last=-1,down=false;
const L=c=>.299*c[0]+.587*c[1]+.114*c[2],rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

/* ---------- image -> palette ---------- */
const LIN=new Float32Array(256).map((_,i)=>{const c=i/255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4});
const F=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
function lab(r,g,b){const R=LIN[r],G=LIN[g],B=LIN[b],x=F((.4124*R+.3576*G+.1805*B)/.95047),y=F(.2126*R+.7152*G+.0722*B),z=F((.0193*R+.1192*G+.9505*B)/1.08883);return[116*y-16,500*(x-y),200*(y-z)]}
const dE=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
function quant(d,n,k,thr){ // thr: CIELAB distance under which two shades are merged (0 = never merge)
 const lb=new Float32Array(n*3);
 for(let i=0;i<n;i++){const l=lab(d[i*4],d[i*4+1],d[i*4+2]);lb[i*3]=l[0];lb[i*3+1]=l[1];lb[i*3+2]=l[2]}
 const box=idx=>{const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];for(let t=0;t<idx.length;t++){const j=idx[t]*3;for(let c=0;c<3;c++){const v=lb[j+c];if(v<mn[c])mn[c]=v;if(v>mx[c])mx[c]=v}}
  let ch=0,r=0,sq=0;for(let c=0;c<3;c++){const w=mx[c]-mn[c];sq+=w*w;if(w>r){r=w;ch=c}}const diag=Math.sqrt(sq);return{idx,ch,diag,s:diag*Math.sqrt(idx.length)}};
 const all=new Int32Array(n);for(let i=0;i<n;i++)all[i]=i;
 let bx=[box(all)];
 // split only boxes whose colours are visibly different; stop early when nothing is left to split
 while(bx.length<k){
  let bi=-1,bs=0;bx.forEach((b,i)=>{if(b.idx.length>1&&b.diag>thr&&b.s>bs){bs=b.s;bi=i}});
  if(bi<0)break;
  const b=bx[bi],ch=b.ch,a=b.idx.sort((p,q)=>lb[p*3+ch]-lb[q*3+ch]),m=a.length>>1;
  bx.splice(bi,1,box(a.slice(0,m)),box(a.slice(m)));
 }
 let p=bx.map(b=>{const t=[0,0,0];for(const j of b.idx)for(let c=0;c<3;c++)t[c]+=lb[j*3+c];return t.map(v=>v/b.idx.length)});
 const as=new Uint8Array(n);
 for(let it=0;it<=3;it++){
  const np=p.length,t=new Float64Array(np*4);
  for(let i=0;i<n;i++){const l=lb[i*3],a=lb[i*3+1],b=lb[i*3+2];let bd=1e9,bi=0;
   for(let c=0;c<np;c++){const q=p[c],e=(q[0]-l)**2+(q[1]-a)**2+(q[2]-b)**2;if(e<bd){bd=e;bi=c}}
   as[i]=bi;if(it<3){t[bi*4]+=l;t[bi*4+1]+=a;t[bi*4+2]+=b;t[bi*4+3]++}}
  if(it<3)p=p.map((c,i)=>t[i*4+3]?[t[i*4]/t[i*4+3],t[i*4+1]/t[i*4+3],t[i*4+2]/t[i*4+3]]:c);
 }
 // average colour per cluster, then fold clusters that look alike into the most common one
 const np=p.length,s=new Float64Array(np*4);
 for(let i=0;i<n;i++){const c=as[i];s[c*4]+=d[i*4];s[c*4+1]+=d[i*4+1];s[c*4+2]+=d[i*4+2];s[c*4+3]++}
 const order=[...Array(np).keys()].filter(c=>s[c*4+3]).sort((a,b)=>s[b*4+3]-s[a*4+3]);
 const kept=[],acc=[],map=new Uint8Array(np);
 for(const c of order){
  const cnt=s[c*4+3],lc=lab(Math.round(s[c*4]/cnt),Math.round(s[c*4+1]/cnt),Math.round(s[c*4+2]/cnt));
  let j=kept.findIndex(q=>dE(q,lc)<thr);
  if(j<0){j=kept.length;kept.push(lc);acc.push([0,0,0,0])}
  map[c]=j;for(let q=0;q<4;q++)acc[j][q]+=s[c*4+q];
 }
 for(let i=0;i<n;i++)as[i]=map[as[i]];
 return{p:acc.map(a=>[a[0]/a[3],a[1]/a[3],a[2]/a[3]]),as};
}
function convert(){
 if(!src)return;
 // keep the original aspect ratio: the longer side gets `size` cells, the shorter side is scaled to match
 const r=src.width/src.height;W=r>=1?size:Math.max(1,Math.round(size*r));H=r>=1?Math.max(1,Math.round(size/r)):size;
 const t=document.createElement('canvas');t.width=W;t.height=H;const c=t.getContext('2d');
 c.fillStyle='#fff';c.fillRect(0,0,W,H);c.imageSmoothingQuality='high';c.drawImage(src,0,0,W,H);
 const d=c.getImageData(0,0,W,H).data,n=W*H;
 const{p,as}=quant(d,n,K,merge);
 const cnt=new Array(p.length).fill(0);for(let i=0;i<n;i++)cnt[as[i]]++;
 const used=[...new Set(as)].sort((a,b)=>cnt[b]-cnt[a]||L(p[a])-L(p[b])),mp={};used.forEach((o,i)=>mp[o]=i);
 pal=used.map(i=>p[i].map(Math.round));tgt=new Uint8Array(n);for(let i=0;i<n;i++)tgt[i]=mp[as[i]];
 fill=new Uint8Array(n);hist=[];rem=new Array(pal.length).fill(0);for(let i=0;i<n;i++)rem[tgt[i]]++;
 const ki=$('#kinfo');if(ki)ki.textContent=`${W} × ${H} cells, ${pal.length} color${pal.length==1?'':'s'} used`;
 draw();
}

/* ---------- drawing ---------- */
const ov=()=>mode==='paint'&&lock&&cs<=baseZ*.5; // zoom lock: zoomed out to 50% of the starting zoom or further (can be switched off)
const maxZ=()=>Math.max(6,Math.min(32,Math.floor(8192/Math.max(W,H))));
function drawSetup(){ // preview is always drawn in the same box, whatever the detail setting is
 const w=$('#wrap'),bw=Math.max(200,Math.min(720,w.clientWidth-32)),bh=Math.max(200,Math.min(540,w.clientHeight-32)),r=src.width/src.height;
 let dw=bw,dh=bw/r;if(dh>bh){dh=bh;dw=bh*r}dw=Math.round(dw);dh=Math.round(dh);
 cv.width=dw;cv.height=dh;cv.style.width=dw+'px';cv.style.height=dh+'px';cv.style.cursor='';
 for(let y=0;y<H;y++){const y0=Math.round(y*dh/H),y1=Math.round((y+1)*dh/H);
  for(let x=0;x<W;x++){const x0=Math.round(x*dw/W),x1=Math.round((x+1)*dw/W);cx.fillStyle=rgb(pal[tgt[y*W+x]]);cx.fillRect(x0,y0,x1-x0,y1-y0)}}
}
function draw(){
 $('#empty').hidden=true;$('#stage').hidden=false;
 if(mode==='setup'){drawSetup();return}
 cv.style.width=cv.style.height='';cv.width=W*cs;cv.height=H*cs;const m=$('#msg');if(m)m.textContent=ov()?'Zoomed out: zoom in to paint.':'';cv.style.cursor=ov()?'zoom-in':'';drawVisible()}
function drawVisible(){
 if(!W)return;let x0=0,y0=0,x1=W-1,y1=H-1;
 if(mode==='paint'){const r=cv.getBoundingClientRect(),w=$('#wrap').getBoundingClientRect();
  x0=Math.max(0,Math.floor((w.left-r.left)/cs)-1);y0=Math.max(0,Math.floor((w.top-r.top)/cs)-1);
  x1=Math.min(W-1,Math.ceil((w.right-r.left)/cs)+1);y1=Math.min(H-1,Math.ceil((w.bottom-r.top)/cs)+1)}
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)dc(y*W+x);
}
function dc(i){
 const x=i%W,y=i/W|0,t=tgt[i],X=x*cs,Y=y*cs;
 if(mode==='setup'||fill[i]){cx.fillStyle=rgb(pal[t]);cx.fillRect(X,Y,cs,cs);if(mode==='paint'&&cs>=10){cx.strokeStyle='rgba(0,0,0,.12)';cx.strokeRect(X+.5,Y+.5,cs-1,cs-1)}return}
 if(ov()){cx.fillStyle='#fff';cx.fillRect(X,Y,cs,cs);return}
 cx.fillStyle=t===cur?'#555b68':'#fafafa';cx.fillRect(X,Y,cs,cs);if(cs>=4){cx.strokeStyle='#c9ced8';cx.strokeRect(X+.5,Y+.5,cs-1,cs-1)}
 if(cs>=12){cx.fillStyle=t===cur?'#fff':'#39404f';cx.font=`${Math.floor(cs*.5)}px system-ui,sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t+1,X+cs/2,Y+cs/2+1)}
}
const cellAt=e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/cs),y=Math.floor((e.clientY-r.top)/cs);return x>=0&&y>=0&&x<W&&y<H?y*W+x:-1};
function setCell(i){fill[i]=1;hist.push(i);rem[tgt[i]]--;dc(i)}
function flood(s){
 const q=[s],seen=new Set([s]),col=tgt[s];
 for(let k=0;k<q.length;k++){const j=q[k],x=j%W,y=j/W|0;if(!fill[j])setCell(j);
  for(const[nx,ny]of[[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(!seen.has(n)&&tgt[n]===col){seen.add(n);q.push(n)}}}
}
const REACH_PX=28; // reach measured in screen pixels, so zooming out lets the cursor reach cells that are further away
let pt=null,rad=1.5,baseZ=22,lock=true,exact=false,magic=false,reachPct=100,sizePct=100;
const ptAt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/cs,y:(e.clientY-r.top)/cs}};
const ok=i=>!fill[i]&&(magic||tgt[i]===cur); // can the brush paint this cell right now?
// a neighbour "closes" a cell when it is off the grid, another colour, or already painted
const wall=(x,y,c)=>{if(x<0||y<0||x>=W||y>=H)return true;const i=y*W+x;return fill[i]===1||(!magic&&tgt[i]!==c)};
function tidy(bx,by,R){ // fill one-cell slivers: gaps between painted cells / colour edges, and dead ends
 for(let pass=0;pass<3;pass++){let ch=false;
  for(let y=by-R;y<=by+R;y++)for(let x=bx-R;x<=bx+R;x++){
   if(x<0||y<0||x>=W||y>=H)continue;const i=y*W+x;if(!ok(i))continue;const c=tgt[i];
   const l=wall(x-1,y,c),r=wall(x+1,y,c),u=wall(x,y-1,c),d=wall(x,y+1,c);
   if((l&&r)||(u&&d)||l+r+u+d>=3){setCell(i);ch=true}
  }
  if(!ch)break;
 }
}
function brush(fx,fy){
 if(exact){ // exact brush: only the cell directly under the cursor
  const x=Math.floor(fx),y=Math.floor(fy);if(x<0||y<0||x>=W||y>=H)return false;
  const i=y*W+x;if(!ok(i))return false;setCell(i);return true}
 const cap=Math.max(W,H)/64,reach=Math.max(.75,Math.min(cap,Math.max(1.2,REACH_PX/cs))*reachPct/100),x0=Math.floor(fx),y0=Math.floor(fy),R=Math.ceil(reach);let best=-1,bd=reach*reach;
 for(let y=y0-R;y<=y0+R;y++)for(let x=x0-R;x<=x0+R;x++){
  if(x<0||y<0||x>=W||y>=H)continue;const i=y*W+x;if(!ok(i))continue;
  const d=(x+.5-fx)**2+(y+.5-fy)**2;if(d<=bd){bd=d;best=i}}
 if(best<0)return false;
 setCell(best);
 // patch radius drifts smoothly between 1 and 2 cells (more slowly for the magic brush, whose round edge shows)
 rad=Math.max(1,Math.min(2,rad+(Math.random()-.5)*(magic?.12:.5)));
 // magic brush centres the patch on the pointer itself, so the edge is a true circle instead of snapping to cell centres
 const r=rad*sizePct/100,ox=magic?fx:best%W+.5,oy=magic?fy:(best/W|0)+.5,bx=Math.floor(ox),by=Math.floor(oy),P=Math.ceil(r);
 for(let y=by-P-1;y<=by+P+1;y++)for(let x=bx-P-1;x<=bx+P+1;x++){
  if(x<0||y<0||x>=W||y>=H)continue;const dx=x+.5-ox,dy=y+.5-oy;
  if(dx*dx+dy*dy>r*r)continue;const i=y*W+x;if(ok(i))setCell(i);
 }
 if(r>=1)tidy(bx,by,P+1);
 return true;
}
function stroke(a,b){ // walk from a to b so fast drags leave no gaps
 const st=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/.5));let any=false;
 for(let k=1;k<=st;k++){const t=k/st;if(brush(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))any=true}
 if(any)after();
}
function skipAll(){ // fill everything that is left, most-used color first, then show the result
 if(!tgt)return;
 for(let c=0;c<pal.length;c++)for(let i=0;i<W*H;i++)if(tgt[i]===c&&!fill[i]){fill[i]=1;hist.push(i);rem[c]--}
 if(mode==='paint'){draw();updPal();const b=$('#bar i');if(b)b.style.width='100%';const n=$('#cnt');if(n)n.textContent=`${W*H} / ${W*H} cells`}
 if(!curId){curId=uid();createdAt=Date.now();pName=defName()}
 if(!viewing)savePainting();
 finish();
}
function paint(i){
 if(i<0||fill[i])return;
 if(tgt[i]!==cur&&!magic)return;
 tool==='fill'?flood(i):setCell(i);after();
}
function after(){
 updPal();$('#bar i').style.width=(100*hist.length/(W*H))+'%';$('#cnt').textContent=`${hist.length} / ${W*H} cells`;
 if(hist.length===W*H){if(!viewing)savePainting();setTimeout(finish,300);return}
 if(!viewing)touch();
 if(rem[cur]===0){const n=pal.findIndex((_,k)=>rem[(cur+1+k)%pal.length]>0);select((cur+1+n)%pal.length)}
}
function select(n){cur=n;updPal();if(mode==='paint')draw()}
function hint(){
 if(mode!=='paint')return;
 if(ov()){cs=baseZ;draw();const z=$('#zm');if(z)z.value=cs}
 const w=$('#wrap'),fx=last>=0?last%W:(w.scrollLeft+w.clientWidth/2)/cs,fy=last>=0?(last/W|0):(w.scrollTop+w.clientHeight/2)/cs;
 let b=-1,bd=1e9;for(let i=0;i<W*H;i++)if(!fill[i]&&tgt[i]===cur){const d=((i%W)+.5-fx)**2+((i/W|0)+.5-fy)**2;if(d<bd){bd=d;b=i}}
 if(b<0){$('#msg').textContent=`Color ${cur+1} is finished.`;return}
 $('#msg').textContent='';const X=(b%W)*cs,Y=(b/W|0)*cs;
 w.scrollTo({left:X+cs/2-w.clientWidth/2,top:Y+cs/2-w.clientHeight/2,behavior:'smooth'});
 const p=$('#pulse');p.style.cssText=`left:${X}px;top:${Y}px;width:${cs}px;height:${cs}px`;p.hidden=false;clearTimeout(p.t);p.t=setTimeout(()=>p.hidden=true,3200);
}
cv.addEventListener('pointerdown',e=>{if(mode!=='paint'||e.button!==0||ov())return;down=true;cv.setPointerCapture(e.pointerId);last=cellAt(e);if(tool==='fill'){paint(last);return}pt=ptAt(e);stroke(pt,pt)});
cv.addEventListener('pointermove',e=>{if(mode!=='paint')return;const i=cellAt(e);if(i>=0)last=i;if(down&&tool==='brush'&&!ov()){const q=ptAt(e);stroke(pt||q,q);pt=q}});
cv.addEventListener('pointerup',()=>down=false);
cv.addEventListener('pointercancel',()=>down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* middle-mouse drag pans, wheel zooms around the cursor */
const wr=$('#wrap');let pan=null;
wr.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault()});
wr.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
wr.addEventListener('pointerdown',e=>{if(e.button!==1)return;e.preventDefault();pan={x:e.clientX,y:e.clientY,l:wr.scrollLeft,t:wr.scrollTop};wr.setPointerCapture(e.pointerId);wr.style.cursor='grabbing'});
wr.addEventListener('pointermove',e=>{if(!pan)return;wr.scrollLeft=pan.l-(e.clientX-pan.x);wr.scrollTop=pan.t-(e.clientY-pan.y)});
const endPan=()=>{pan=null;wr.style.cursor=''};
wr.addEventListener('pointerup',e=>{if(e.button===1)endPan()});
wr.addEventListener('pointercancel',endPan);
wr.addEventListener('wheel',e=>{
 if(mode!=='paint')return;e.preventDefault();
 const up=e.deltaY<0;let n=Math.round(cs*(up?1.12:1/1.12));if(n===cs)n+=up?1:-1;n=Math.max(1,Math.min(maxZ(),n));if(n===cs)return;
 const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/cs,fy=(e.clientY-r.top)/cs;
 cs=n;draw();$('#pulse').hidden=true;const z=$('#zm');if(z)z.value=cs;
 const r2=cv.getBoundingClientRect();wr.scrollLeft+=r2.left+fx*cs-e.clientX;wr.scrollTop+=r2.top+fy*cs-e.clientY;drawVisible();
},{passive:false});
let raf=0;const again=()=>{if(mode==='paint'&&!raf)raf=requestAnimationFrame(()=>{raf=0;drawVisible()})};
wr.addEventListener('scroll',again);addEventListener('resize',again);
$('#pal').addEventListener('wheel',e=>{e.preventDefault();e.currentTarget.scrollLeft+=e.deltaY||e.deltaX},{passive:false});

/* ---------- UI ---------- */
function buildPal(){
 const p=$('#pal');p.innerHTML='';pal.forEach((c,i)=>{const b=document.createElement('button');b.className='sw';b.style.background=rgb(c);b.style.color=L(c)>140?'#111':'#fff';b.innerHTML=`${i+1}<small></small>`;b.title=`Color ${i+1}`;b.onclick=()=>select(i);p.appendChild(b)});p.hidden=false;updPal();
}
function updPal(){document.querySelectorAll('.sw').forEach((b,i)=>{b.classList.toggle('on',i===cur);b.classList.toggle('done',rem[i]===0);b.querySelector('small').textContent=rem[i]===0?'✓':rem[i]})}
function link(r,nm,lo,hi,set){
 const R=$(r),N=$(nm);
 R.oninput=()=>{N.value=R.value;set(+R.value)};R.onchange=convert;
 N.oninput=()=>{const v=+N.value;if(v>=lo&&v<=hi){R.value=v;set(v)}};
 N.onchange=()=>{let v=Math.round(+N.value);if(!(v>=lo))v=lo;if(v>hi)v=hi;N.value=R.value=v;set(v);convert()};
}
function side(){
 const s=$('#side');
 if(mode==='setup')s.innerHTML=`<label class="btn">Choose image<input id="f" type="file" accept="image/*" hidden></label><button id="smp">Use sample image</button>
 <div class="g"><span>Detail: cells on the longest side</span><div class="pair"><input id="sz" type="range" min="8" max="512" value="${size}"><input id="szn" type="number" min="8" max="512" value="${size}"></div></div>
 <div class="g"><span>Max colors: an upper limit, similar shades are merged</span><div class="pair"><input id="kc" type="range" min="2" max="128" value="${K}"><input id="kcn" type="number" min="2" max="128" value="${K}"></div></div><div class="g"><span>Color combining: higher merges more distant colors, lower only the most similar. 0 keeps as many colors as the max allows.</span><div class="pair"><input id="mg" type="range" min="0" max="30" value="${merge}"><input id="mgn" type="number" min="0" max="30" value="${merge}"></div></div><small id="kinfo" style="color:var(--fg)"></small>
 <button class="pri" id="go" ${src?'':'disabled'}>Start painting</button><button id="skip0" ${src?'':'disabled'}>Skip painting: show finished image</button><small style="color:var(--mut)">The preview updates when you release a slider or press Enter in a number box. More detail means more cells to paint.</small>`;
 else s.innerHTML=`<input id="nm" type="text" maxlength="60" placeholder="Name this painting"><small id="svd" style="color:var(--mut)"></small><div class="tools"><button id="t1" class="${tool=='brush'?'on':''}">Brush</button><button id="t2" class="${tool=='fill'?'on':''}">Fill</button><button id="t3">Hint</button></div>
 <label class="chk"><input id="ex" type="checkbox" ${exact?'checked':''}>Exact brush: only the cell under the cursor</label><label class="chk"><input id="mc" type="checkbox" ${magic?'checked':''}>Magic brush: paint each cell in its own color, whatever is selected</label><label class="row"><span>Brush reach: <b id="rv">${reachPct}</b>%</span><input id="rs" type="range" min="0" max="100" value="${reachPct}"></label><label class="row"><span>Brush size: <b id="zv">${sizePct}</b>%</span><input id="zs" type="range" min="0" max="300" value="${sizePct}"></label><small style="color:var(--mut)">Pick a number, then drag near cells with that number. Brush paints the closest matching cell plus a small patch around it, and fills one-cell gaps at edges. Turn on Exact brush to paint only the cell directly under the cursor. Fill paints a whole connected area. With the zoom lock on, zooming out to half the starting zoom or less shows unpainted cells as white and turns painting off.</small><div id="msg" style="min-height:1.2em;color:var(--ac)"></div>
 <label class="row"><span>Zoom</span><input id="zm" type="range" min="1" max="${maxZ()}" value="${cs}"></label>
 <label class="chk"><input id="lk" type="checkbox" ${lock?'checked':''}>Lock painting when zoomed out</label>
 <div><div id="bar"><i></i></div><small id="cnt" style="color:var(--mut)">0 / ${W*H} cells</small></div><button id="fit">Fit whole image</button><button id="skip">Skip painting: show finished image</button><button id="bk">Back to settings</button>`;
 if(mode==='setup'){
  $('#f').onchange=e=>e.target.files[0]&&load(e.target.files[0]);$('#smp').onclick=sample;
  link('#sz','#szn',8,512,v=>size=v);link('#kc','#kcn',2,128,v=>K=v);link('#mg','#mgn',0,30,v=>merge=v);$('#skip0').onclick=skipAll;
  $('#go').onclick=()=>{curId=uid();createdAt=Date.now();pName=defName();viewing=false;startPaint()};
 }else{
  $('#t1').onclick=()=>{tool='brush';side()};$('#t2').onclick=()=>{tool='fill';side()};$('#t3').onclick=hint;
  $('#zm').oninput=e=>{cs=+e.target.value;draw()};
  $('#lk').onchange=e=>{lock=e.target.checked;draw()};
  $('#nm').value=pName;$('#nm').oninput=e=>{pName=e.target.value;touch()};$('#svd').textContent=savedMsg;
  $('#ex').onchange=e=>{exact=e.target.checked};$('#mc').onchange=e=>{magic=e.target.checked};
  $('#rs').oninput=e=>{reachPct=+e.target.value;$('#rv').textContent=reachPct};$('#zs').oninput=e=>{sizePct=+e.target.value;$('#zv').textContent=sizePct};$('#skip').onclick=skipAll;
  $('#fit').onclick=()=>{const w=$('#wrap');cs=Math.max(1,Math.min(maxZ(),Math.floor(Math.min((w.clientWidth-32)/W,(w.clientHeight-32)/H))));draw();$('#zm').value=cs;$('#pulse').hidden=true;w.scrollTo(0,0);drawVisible()};
  $('#bk').onclick=()=>{flushSave();toSetup()};
 }
}
function load(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{src=im;mode='setup';$('#pal').hidden=true;side();convert()};im.src=r.result};r.readAsDataURL(f)}
function sample(){
 const c=document.createElement('canvas');c.width=160;c.height=110;const g=c.getContext('2d');
 let q=g.createLinearGradient(0,0,0,110);q.addColorStop(0,'#2b2f77');q.addColorStop(.55,'#f0647a');q.addColorStop(1,'#ffc46b');g.fillStyle=q;g.fillRect(0,0,160,110);
 g.fillStyle='#fff3b0';g.beginPath();g.arc(105,62,22,0,7);g.fill();
 g.fillStyle='#3a2a5c';g.beginPath();g.moveTo(0,110);g.lineTo(0,80);g.quadraticCurveTo(40,50,80,85);g.quadraticCurveTo(120,60,160,88);g.lineTo(160,110);g.fill();
 g.fillStyle='#1a1233';g.beginPath();g.moveTo(0,110);g.lineTo(0,98);g.quadraticCurveTo(60,80,110,100);g.quadraticCurveTo(140,92,160,100);g.lineTo(160,110);g.fill();
 src=c;mode='setup';$('#pal').hidden=true;side();convert();
}
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))load(f)});

/* ---------- saving + gallery (IndexedDB, stays in this browser) ---------- */
let curId=null,createdAt=0,pName='',saveT=0,savedMsg='',viewing=false,galList=[],galTab='paused',delArm=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const defName=()=>'Painting '+fmt(Date.now());
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idb=new Promise((res,rej)=>{try{const q=indexedDB.open('pixelpaint',1);
 q.onupgradeneeded=()=>{q.result.createObjectStore('meta',{keyPath:'id'});q.result.createObjectStore('data',{keyPath:'id'})};
 q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}});
idb.catch(()=>{});
function dbRun(names,mode,fn){return idb.then(db=>new Promise((res,rej)=>{
 const t=db.transaction(names,mode);let r;
 try{r=fn(...names.map(n=>t.objectStore(n)))}catch(e){rej(e);return}
 t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'))}))}
function thumb(){
 const k=192/Math.max(W,H),sc=k>=1?Math.floor(k):k,dw=Math.max(1,Math.round(W*sc)),dh=Math.max(1,Math.round(H*sc)),c=document.createElement('canvas');c.width=dw;c.height=dh;const g=c.getContext('2d');
 for(let y=0;y<H;y++){const y0=Math.round(y*dh/H),y1=Math.round((y+1)*dh/H);
  for(let x=0;x<W;x++){const x0=Math.round(x*dw/W),x1=Math.round((x+1)*dw/W),i=y*W+x;g.fillStyle=fill[i]?rgb(pal[tgt[i]]):'#e9ecf1';g.fillRect(x0,y0,x1-x0,y1-y0)}}
 return c.toDataURL('image/png');
}
function touch(){if(viewing)return;clearTimeout(saveT);saveT=setTimeout(savePainting,1500)} // autosave 1.5 s after the last change
function flushSave(){clearTimeout(saveT);if(curId&&hist.length&&!viewing)savePainting()}
async function savePainting(){
 clearTimeout(saveT);if(!curId||!tgt||!hist.length)return;
 const n=W*H,done=hist.length===n;
 const meta={id:curId,name:pName||defName(),W,H,colors:pal.length,pct:Math.round(100*hist.length/n),status:done?'done':'paused',created:createdAt,updated:Date.now(),thumb:thumb()};
 const data={id:curId,pal,tgt,fill,hist:Uint32Array.from(hist)};
 try{await dbRun(['meta','data'],'readwrite',(m,d)=>{m.put(meta);d.put(data)});savedMsg='Saved '+fmt(Date.now())}
 catch(e){savedMsg='Could not save: browser storage is unavailable'}
 const el=$('#svd');if(el)el.textContent=savedMsg;
}
function startPaint(){mode='paint';cur=0;last=-1;cs=Math.min(maxZ(),Math.max(14,Math.min(32,Math.floor(900/W))));baseZ=cs;side();buildPal();draw();after();clearTimeout(saveT)}
function toSetup(){curId=null;viewing=false;mode='setup';$('#pal').hidden=true;side();if(src)convert();else{$('#stage').hidden=true;$('#empty').hidden=false}}
async function openPainting(id){
 const m=galList.find(x=>x.id===id);if(!m)return;let d;
 try{d=await dbRun(['data'],'readonly',st=>st.get(id))}catch(e){return}
 if(!d)return;
 W=m.W;H=m.H;pal=d.pal;tgt=d.tgt;fill=d.fill;hist=Array.from(d.hist);
 rem=new Array(pal.length).fill(0);for(let i=0;i<W*H;i++)if(!fill[i])rem[tgt[i]]++;
 curId=id;createdAt=m.created;pName=m.name;savedMsg='';viewing=m.status==='done';
 $('#gal').style.display='none';startPaint();
}
async function delPainting(id){
 delArm=null;try{await dbRun(['meta','data'],'readwrite',(m,d)=>{m.delete(id);d.delete(id)})}catch(e){}
 galList=galList.filter(x=>x.id!==id);
 if(id===curId){curId=null;clearTimeout(saveT);savedMsg='Deleted from the gallery; no longer saving this one';const el=$('#svd');if(el)el.textContent=savedMsg}
 renderGal();
}
function card(m){
 const done=m.status==='done';
 return `<div class="card"><img src="${m.thumb}" alt=""><b>${esc(m.name)}</b><small>${m.W}×${m.H}, ${m.colors} colors${done?'':', '+m.pct+'% painted'}<br>${fmt(m.updated)}</small>
 <div class="row2"><button class="pri" data-a="open" data-id="${m.id}">${done?'View':'Resume'}</button><button data-a="del" data-id="${m.id}">${delArm===m.id?'Sure?':'Delete'}</button></div></div>`;
}
function renderGal(err){
 const np=galList.filter(m=>m.status==='paused').length,nd=galList.length-np,items=galList.filter(m=>m.status===galTab);
 $('#gbody').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Gallery</h2><button id="gx">Close</button></div>
 <div class="tools" style="grid-template-columns:1fr 1fr"><button data-t="paused" class="${galTab==='paused'?'on':''}">In progress (${np})</button><button data-t="done" class="${galTab==='done'?'on':''}">Finished (${nd})</button></div>
 ${err?`<p style="color:var(--mut)">${err}</p>`:items.length?`<div class="cards">${items.map(card).join('')}</div>`:`<p style="color:var(--mut)">${galTab==='done'?'No finished paintings yet.':'No paused paintings. Paintings you start are saved here automatically.'}</p>`}
 <small style="color:var(--mut)">Paintings are stored in this browser on this device. Clearing the site's data removes them.</small>`;
}
async function showGallery(){
 flushSave();$('#gal').style.display='block';let err='';
 try{galList=(await dbRun(['meta'],'readonly',st=>st.getAll())).sort((a,b)=>b.updated-a.updated)}catch(e){galList=[];err='Browser storage is unavailable here, so nothing can be saved or listed.'}
 renderGal(err);
}
$('#gb').onclick=showGallery;
$('#gal').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='gx'){$('#gal').style.display='none';return}
 if(b.dataset.t){galTab=b.dataset.t;renderGal();return}
 const id=b.dataset.id;if(!id)return;
 if(b.dataset.a==='open')openPainting(id);
 if(b.dataset.a==='del'){if(delArm!==id){delArm=id;renderGal();setTimeout(()=>{if(delArm===id){delArm=null;renderGal()}},4000);return}delPainting(id)}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});addEventListener('pagehide',flushSave);

/* ---------- finish: image + 10s GIF ---------- */
function lzw(ix,min){
 const clr=1<<min,eoi=clr+1;let size=min+1,next=eoi+1,dict=new Map(),out=[],cur=0,n=0;
 const emit=c=>{cur|=c<<n;n+=size;while(n>=8){out.push(cur&255);cur>>=8;n-=8}};
 emit(clr);let pre=ix[0];
 for(let i=1;i<ix.length;i++){
  const k=ix[i],key=(pre<<8)|k,v=dict.get(key);
  if(v!==undefined){pre=v;continue}
  emit(pre);pre=k;
  if(next===4096){emit(clr);next=eoi+1;size=min+1;dict.clear()}
  else{if(next>=(1<<size))size++;dict.set(key,next++)}
 }
 emit(pre);emit(eoi);if(n>0)out.push(cur&255);return out;
}
function encodeGif(w,h,frames,delay,colors){
 let bits=2;while((1<<bits)<colors.length)bits++;
 const o=[],p=(...a)=>{for(const v of a)o.push(v)},s=v=>p(v&255,v>>8&255);
 for(const ch of'GIF89a')p(ch.charCodeAt(0));
 s(w);s(h);p(0x80|((bits-1)<<4)|(bits-1),0,0);
 for(let i=0;i<1<<bits;i++)p(...(colors[i]||[0,0,0]));
 const ext=o.length;p(0x21,0xFF,11);for(const ch of'NETSCAPE2.0')p(ch.charCodeAt(0));p(3,1,0,0,0);
 for(const fr of frames){
  p(0x21,0xF9,4,0);s(delay);p(0,0);p(0x2C);s(0);s(0);s(w);s(h);p(0,bits);
  const d=lzw(fr,bits);for(let i=0;i<d.length;i+=255){const c=d.slice(i,i+255);p(c.length);for(const v of c)o.push(v)}
  p(0);
 }
 p(0x3B);return{u8:new Uint8Array(o),ext};
}
let gifSec=10,gifFps=10,gifRel=false,noLoop=false,gifJob=0,gifNote='',gifU8=null,gifExt=0,gifTag=0,gifCap='';
function makeGif(T,fps,rel){
 // frame delays are whole centiseconds (browsers treat <2 as slower, so 50 fps is the fastest a GIF can play); very long, fast GIFs of big images are capped
 const s=Math.max(1,Math.floor(320/Math.max(W,H))),fw=W*s,fh=H*s,st=new Uint8Array(W*H),map=new Uint32Array(fw*fh),frames=[];
 let dl=Math.max(2,Math.round(100/fps)),N=Math.max(2,Math.round(T*100/dl));
 const nmax=Math.max(2,Math.floor(6e7/(fw*fh)));
 if(N>nmax){dl=Math.max(2,Math.ceil(T*100/nmax));N=Math.max(2,Math.round(T*100/dl))}
 gifNote=`${N} frames at ${+(100/dl).toFixed(1)} fps`;
 // time each painted cell occupies: equal, or (rel) inversely to how common its colour is, so common colours play faster
 const tot=new Array(pal.length).fill(0);for(let i=0;i<W*H;i++)tot[tgt[i]]++;
 const cum=new Float64Array(hist.length);let acc=0;
 for(let k=0;k<hist.length;k++){acc+=rel?1/tot[tgt[hist[k]]]:1;cum[k]=acc}
 for(let k=0;k<hist.length;k++)cum[k]/=acc;
 for(let y=0;y<fh;y++)for(let x=0;x<fw;x++)map[y*fw+x]=((y/s|0)*W)+(x/s|0);
 let dn=0;
 for(let f=0;f<N;f++){const t=f/(N-1);while(dn<hist.length&&cum[dn]<=t+1e-9){const c=hist[dn++];st[c]=tgt[c]+1}
  const fr=new Uint8Array(fw*fh);for(let i=0;i<fr.length;i++)fr[i]=st[map[i]];frames.push(fr)}
 return encodeGif(fw,fh,frames,dl,[[238,240,244],...pal]);
}
function showGif(){ // a fresh copy each time (unique comment block) so the browser restarts the animation; noLoop drops the loop block
 if(!gifU8)return;
 const job=gifJob,u=gifU8,e=gifExt,tag=String(++gifTag).padStart(8,'0');
 const parts=noLoop?[u.subarray(0,e),u.subarray(e+19,u.length-1)]:[u.subarray(0,u.length-1)];
 parts.push(new Uint8Array([0x21,0xFE,8,...[...tag].map(c=>c.charCodeAt(0)),0,0x3B]));
 const r=new FileReader();
 r.onload=()=>{if(job!==gifJob)return;$('#gf').innerHTML=`<img src="${r.result}" alt="Painting process"><figcaption>${gifCap}${noLoop?', plays once':''}</figcaption><a class="btn" download="painting-process.gif" href="${r.result}">Save GIF</a>`};
 r.readAsDataURL(new Blob(parts,{type:'image/gif'}));
}
function buildGif(){
 const gf=$('#gf'),job=++gifJob,T=gifSec,F=gifFps,R=gifRel;
 gf.innerHTML=`<div style="padding:30px 0;color:var(--mut)">Building your ${T}-second GIF…</div>`;
 setTimeout(()=>{if(job!==gifJob)return;const res=makeGif(T,F,R);gifU8=res.u8;gifExt=res.ext;gifCap=`Your painting process: ${T} seconds, ${gifNote}`;showGif()},50);
}
function sync(r,n,lo,hi,dp,set){
 const R=$(r),N=$(n);
 R.oninput=()=>{N.value=R.value;set(+R.value)};R.onchange=buildGif;
 N.oninput=()=>{const v=+N.value;if(v>=lo&&v<=hi){R.value=v;set(v)}};
 N.onchange=()=>{let v=+N.value;if(!(v>=lo))v=lo;if(v>hi)v=hi;v=+v.toFixed(dp);N.value=R.value=v;set(v);buildGif()};
}
function finish(){
 const m=$('#modal'),b=$('#mbody');m.style.display='block';
 const s=Math.max(1,Math.floor(1024/Math.max(W,H))),c=document.createElement('canvas');c.width=W*s;c.height=H*s;const g=c.getContext('2d');
 for(let i=0;i<W*H;i++){g.fillStyle=rgb(pal[tgt[i]]);g.fillRect((i%W)*s,(i/W|0)*s,s,s)}
 const png=c.toDataURL('image/png');
 b.innerHTML=`<h2 style="margin:0">Finished</h2><div class="res"><figure><img src="${png}" alt="Finished pixel art"><figcaption>Your pixel art (${W}×${H})</figcaption><a class="btn" download="pixel-art.png" href="${png}">Save image</a></figure>
 <figure id="gf"></figure></div>
 <div class="pair"><label class="chk"><input id="lp" type="checkbox" ${noLoop?'checked':''}>Preview without looping</label><button id="pl">▶ Play</button></div>
 <div class="g"><span>GIF length in seconds (0.5 to 30)</span><div class="pair"><input id="gs" type="range" min="0.5" max="30" step="0.1" value="${gifSec}"><input id="gsn" type="number" min="0.5" max="30" step="0.1" value="${gifSec}"></div></div>
 <div class="g"><span>GIF frames per second (1 to 60). GIF files can't play faster than 50 fps, so 50 to 60 all play at 50. Very long, fast GIFs of big images are capped.</span><div class="pair"><input id="gr" type="range" min="1" max="60" step="1" value="${gifFps}"><input id="grn" type="number" min="1" max="60" step="1" value="${gifFps}"></div></div>
 <label class="chk"><input id="gl" type="checkbox" ${gifRel?'checked':''}>Speed follows color amount: common colors play faster, so every color takes about equal time</label>
 <small style="color:var(--mut)">The GIF rebuilds when you release a slider or press Enter in a box. If a save button does nothing in your browser, right-click (or long-press) the picture and choose Save image.</small>
 <div style="display:flex;gap:8px"><button class="pri" id="again">Paint another</button><button id="cls">Close</button></div>`;
 $('#again').onclick=()=>{gifJob++;m.style.display='none';$('#gal').style.display='none';toSetup()};
 $('#cls').onclick=()=>{gifJob++;m.style.display='none';if(mode==='setup'){curId=null;if(src)convert()}};
 sync('#gs','#gsn',.5,30,1,v=>gifSec=v);sync('#gr','#grn',1,60,0,v=>gifFps=v);
 $('#gl').onchange=e=>{gifRel=e.target.checked;buildGif()};
 $('#lp').onchange=e=>{noLoop=e.target.checked;showGif()};$('#pl').onclick=showGif;
 buildGif();
}
side();
</script></body></html>
